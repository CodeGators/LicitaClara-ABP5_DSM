[project]
name = "licita-clara-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx2>=1,<3",
    "ruff>=0.11,<1",
    "pypdf>=6,<7",
]
diagnostics = ["pyarrow==23.0.1"]

[tool.uv.workspace]
members = ["backend", "collector", "ml", "shared"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "collector/tests", "shared/tests", "ml/tests"]
markers = ["integration: requires TEST_DATABASE_URL pointing to disposable PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["scripts/**/*.py", "backend/**/*.py", "collector/src/**/*.py", "collector/tests/**/*.py", "shared/**/*.py", "ml/src/**/*.py", "ml/tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I"]
