name: Python CI
on:
  push:
    paths: ["backend/**", "collector/**", "shared/**", "ml/**", "pyproject.toml", "uv.lock", ".python-version", "alembic.ini", "infra/compose.yaml", ".github/workflows/python-ci.yml"]
  pull_request:
    paths: ["backend/**", "collector/**", "shared/**", "ml/**", "pyproject.toml", "uv.lock", ".python-version", "alembic.ini", "infra/compose.yaml", ".github/workflows/python-ci.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: licita
          POSTGRES_PASSWORD: ci_ephemeral_only
          POSTGRES_DB: licita_clara_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U licita -d licita_clara_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://licita:ci_ephemeral_only@127.0.0.1:5432/licita_clara_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.2
      - run: uv sync --locked --all-packages --extra validation
      - run: uv run --locked --all-packages --extra validation ruff check .
      - run: uv run --locked --all-packages --extra validation ruff format --check .
      - run: uv run --locked --all-packages --extra validation pytest
      - run: uv run --locked --package licita-collector licita-collector --version
      - run: uv run --locked --package licita-ml licita-ml --version
