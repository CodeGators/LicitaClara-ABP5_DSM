[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "licita-collector"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["licita-shared", "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.8,<3"]

[project.optional-dependencies]
s3 = ["boto3>=1.38,<2"]

[project.scripts]
licita-collector = "licita_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
licita-shared = { workspace = true }
