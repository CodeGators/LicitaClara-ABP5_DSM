[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "licita-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "licita-shared",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "alembic>=1.15,<2",
  "python-dotenv>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
licita-shared = { workspace = true }
